name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: v1.12.0
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Browser (desktop)
        - Browser (phone)
        - Installed app (PWA)
        - Android app
        - MCP server
        - Self-hosted backend
  - type: markdown
    attributes:
      value: |
        Issues are public. Please don't paste task titles or anything else private.
        Security problems go to the [security policy](https://github.com/MelBourbon/tidypepple/blob/master/SECURITY.md) instead.
