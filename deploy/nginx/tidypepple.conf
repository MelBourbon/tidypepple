# TidyPepple – nginx als statischer Auslieferer.
#
# Die App hat keinen Serveranteil: sie ist ein Ordner mit Dateien, der Rest passiert im
# Browser (IndexedDB) und optional bei Supabase. nginx liefert `dist/` deshalb direkt aus,
# ein Node-Prozess wird im Betrieb nicht gebraucht.
#
# Ablage:  /etc/nginx/sites-available/tidypepple
#          sudo ln -s ../sites-available/tidypepple /etc/nginx/sites-enabled/tidypepple
#          sudo nginx -t && sudo systemctl reload nginx

# Cache-Control pro Pfad, statt add_header in mehreren location-Bloecken.
#
# Der Grund ist eine nginx-Eigenheit, die leicht unbemerkt bleibt: sobald ein
# location-Block ein eigenes `add_header` hat, verwirft er *alle* geerbten Header.
# Mit Cache-Control je location fehlten Content-Security-Policy und HSTS damit
# ausgerechnet auf index.html und sw.js. Über eine map gibt es nur einen einzigen
# Satz add_header auf Server-Ebene – und keine stillen Lücken.
map $uri $tidypepple_cache {
    default                "public, max-age=3600";
    ~^/assets/             "public, max-age=31536000, immutable";
    /index.html            "no-cache, must-revalidate";
    /sw.js                 "no-cache, must-revalidate";
    /manifest.webmanifest  "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name tidypepple.example.com;

    # Diese Location muss vor dem Redirect stehen, sonst scheitert die
    # Zertifikatserneuerung von certbot an der Weiterleitung.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tidypepple.example.com;

    ssl_certificate     /etc/letsencrypt/live/tidypepple.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tidypepple.example.com/privkey.pem;

    root /srv/tidypepple/dist;
    index index.html;

    # `.webmanifest` fehlt in nginx' mitgelieferter mime.types. Ohne den richtigen Typ
    # ignorieren manche Browser das Manifest und bieten die Installation nicht an.
    types {
        application/manifest+json  webmanifest;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------
    # Header. Alle an einer Stelle – siehe die Erklärung bei der map oben.
    #
    # Caching ist hier der kritischste Punkt: wird der Service Worker gecacht,
    # erreichen Updates die Nutzer nie, und die App bleibt dauerhaft auf einem
    # alten Stand stehen. Dateien in /assets/ tragen dagegen einen Inhalts-Hash
    # im Namen und dürfen deshalb beliebig lange liegen bleiben.
    # ---------------------------------------------------------------------
    add_header Cache-Control $tidypepple_cache always;
    # 'wasm-unsafe-eval' ist nicht optional: die Passphrase wird mit Argon2id als
    # WebAssembly abgeleitet. Ohne diese Quelle scheitert das Entsperren des Vaults mit
    # "Compiling or instantiating WebAssembly module violates ... Content Security Policy".
    # 'unsafe-inline' bei style-src braucht Tailwind für die eingebetteten Stile.
    # connect-src öffnet Supabase – bei eigenem Backend hier anpassen, sonst streichen.
    # https://tidypepple.com: die Android-App liest dort android/version.json für den
    # Update-Hinweis (src/platform/appUpdate.ts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tidypepple.com; base-uri 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'" always;
    # Die App soll nicht in Suchergebnissen landen (leere Ansichten wie /inbox oder
    # /board sind schlechte Einstiege – dafür gibt es die Website). Der Header deckt
    # auch alles ab, was kein HTML ist. Bewusst kein Disallow in robots.txt: sonst
    # ruft Google die Seiten nicht mehr ab und sieht das noindex nie.
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # HSTS erst einschalten, wenn HTTPS sicher dauerhaft steht: Browser merken sich den
    # Zwang, ein Rückweg auf HTTP ist danach für die Dauer von max-age versperrt.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------------------------------------------------------------------
    # Optional: Start- und Fehler-Ping der App (`VITE_BEACON=on`, src/telemetry.ts). Die
    # App ruft dann `/beacon?…` auf; nötig ist nur eine location, die 204 liefert und den
    # Aufruf in ein eigenes Log schreibt, das ein externer Report-Job auswertet:
    #
    #   location = /beacon { access_log /var/log/tidypepple/beacon.log <format>; return 204; }
    #
    # Ohne VITE_BEACON gibt es keinen Ping, und dieser Block entfällt.
    # ---------------------------------------------------------------------

    # ---------------------------------------------------------------------
    # Digital Asset Links für die Android-App (eigenes Repository). Ohne gültige
    # Datei zeigt die App eine Browser-Adressleiste. Fehlt sie, lieber 404 als die
    # index.html des SPA-Fallbacks – die hielte Android für kaputtes JSON.
    # ---------------------------------------------------------------------
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # SPA-Fallback: /board, /task/<id> usw. sind Client-Routen ohne eigene Datei.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
